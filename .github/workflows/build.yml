name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7   # check Docker Hub for the exact tag you use
    steps:
      - uses: actions/checkout@v5

      - name: Setup templates
        run: |
          ls /root/.local/share/godot/export_templates || true
          if [ "$HOME" != "/root" ]; then
            mkdir -p ~/.local/share/godot
            cp -r /root/.local/share/godot/export_templates ~/.local/share/godot/
          fi

      - name: Export
        run: |
          mkdir -p build/windows build/linux
          godot --headless --import || true
          godot --headless --export-release "Windows Desktop" build/windows/Turdtris.exe
          godot --headless --export-release "Linux" build/linux/Turdtris.x86_64
          chmod +x build/linux/Turdtris.x86_64

      - name: Zip
        run: |
          apt-get update -qq && apt-get install -y -qq zip > /dev/null || true
          (cd build/windows && zip -r ../Turdtris-windows.zip .)
          (cd build/linux && zip -r ../Turdtris-linux.zip .)

      - uses: actions/upload-artifact@v5
        with:
          name: turdtris-windows
          path: build/Turdtris-windows.zip

      - uses: actions/upload-artifact@v5
        with:
          name: turdtris-linux
          path: build/Turdtris-linux.zip
