name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7   # check Docker Hub for the exact tag
    steps:
      - uses: actions/checkout@v4
      - name: Setup templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Export
        run: |
          mkdir -p build/windows build/linux
          godot --headless --export-release "Windows Desktop" build/windows/Turdtris.exe
          godot --headless --export-release "Linux" build/linux/Turdtris.x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: turdtris-windows
          path: build/windows
      - uses: actions/upload-artifact@v4
        with:
          name: turdtris-linux
          path: build/linux