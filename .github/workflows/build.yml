name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to attach files to a release
    container:
      image: barichello/godot-ci:4.7   # check Docker Hub for the exact tag you use
    steps:
      - uses: actions/checkout@v5

      - name: Setup templates
        run: |
          ls /root/.local/share/godot/export_templates || true
          if [ "$HOME" != "/root" ]; then
            mkdir -p ~/.local/share/godot
            cp -r /root/.local/share/godot/export_templates ~/.local/share/godot/
          fi

      - name: Export
        run: |
          mkdir -p build/windows build/linux build/mac
          godot --headless --import || true
          godot --headless --export-release "Windows Desktop" build/windows/Turdtris.exe
          godot --headless --export-release "Linux" build/linux/Turdtris.x86_64
          godot --headless --export-release "macOS" build/mac/Turdtris-macOS.zip
          chmod +x build/linux/Turdtris.x86_64

      - name: Check the exe is a single file
        run: |
          if [ -f build/windows/Turdtris.pck ]; then
            echo "Turn on 'Embed PCK' in the Windows Desktop export preset, then commit export_presets.cfg"
            exit 1
          fi

      - name: Build the AppImage
        run: |
          apt-get update -qq && apt-get install -y -qq wget file > /dev/null || true
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          mkdir -p AppDir/usr/bin
          cp build/linux/Turdtris.x86_64 AppDir/usr/bin/Turdtris.x86_64
          cp build/linux/*.pck AppDir/usr/bin/ 2>/dev/null || true
          cp icon.png AppDir/turdtris.png
          cat > AppDir/turdtris.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Turdtris
          Exec=Turdtris.x86_64
          Icon=turdtris
          Categories=Game;
          EOF
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/Turdtris.x86_64" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir build/Turdtris-x86_64.AppImage

      - uses: actions/upload-artifact@v5
        with:
          name: turdtris-windows
          path: build/windows/Turdtris.exe

      - uses: actions/upload-artifact@v5
        with:
          name: turdtris-linux
          path: build/Turdtris-x86_64.AppImage

      - uses: actions/upload-artifact@v5
        with:
          name: turdtris-macos
          path: build/mac/Turdtris-macOS.zip

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/windows/Turdtris.exe
            build/Turdtris-x86_64.AppImage
            build/mac/Turdtris-macOS.zip

      - name: Publish to itch.io with butler
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ secrets.ITCH_TARGET }}   # looks like  yourname/turdtris
        run: |
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$ITCH_TARGET" ]; then
            echo "BUTLER_API_KEY / ITCH_TARGET not set, skipping itch.io upload"
            exit 0
          fi
          apt-get update -qq && apt-get install -y -qq curl unzip > /dev/null || true
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q -o butler.zip -d butler-bin
          chmod +x butler-bin/butler
          VER="${GITHUB_REF_NAME#v}"
          ./butler-bin/butler push build/windows/Turdtris.exe "$ITCH_TARGET:windows" --userversion "$VER"
          ./butler-bin/butler push build/Turdtris-x86_64.AppImage "$ITCH_TARGET:linux" --userversion "$VER"
          ./butler-bin/butler push build/mac/Turdtris-macOS.zip "$ITCH_TARGET:mac" --userversion "$VER"
